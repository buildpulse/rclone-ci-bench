name: gh-apt-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          for h in github.com azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do echo "$h: $(getent hosts $h | head -1)"; done
          dig +short +time=3 +tries=1 @1.1.1.1 archive.ubuntu.com || echo "dig 1.1.1.1 failed"
          dig +short +time=3 +tries=1 @8.8.8.8 azure.archive.ubuntu.com || echo "dig 8.8.8.8 failed"
          dig +short +time=3 +tries=1 @168.63.129.16 archive.ubuntu.com || echo "dig azure dns failed"
