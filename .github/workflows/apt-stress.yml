# How often does a cold `apt-get update` hang on the runner image, and is the
# two-entry mirror+file pool the cause? Each job runs N cold updates (lists
# wiped first) with apt's worker message trace on. A run still going after
# HANG_S seconds is a hang: the job records the process states, sockets and the
# trace tail, kills apt and moves on.
#   pool   = image as shipped: mirror+file, us-west-2 then us-east-1
#   single = mirror+file with only the first entry (mirror method, no failover)
#   direct = plain http to the first entry (no mirror method at all)
# The cli.github.com source is removed in every variant so only Ubuntu
# mirrors are under test.
name: apt-stress
on:
  workflow_dispatch:
    inputs:
      iterations:
        default: "30"
permissions:
  contents: read
jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        runs_on: [bp-ubuntu-latest-x64-4x, bp-ubuntu-latest-arm64-4x]
        variant: [pool, single, direct]
        shard: [1, 2]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    env:
      N: ${{ inputs.iterations }}
      HANG_S: "150"
    steps:
      - name: configure variant
        run: |
          set -eu
          sudo rm -f /etc/apt/sources.list.d/github-cli.list
          first=$(head -1 /etc/apt/bp-mirrors.txt)
          case "${{ matrix.variant }}" in
            pool) ;;
            single) echo "$first" | sudo tee /etc/apt/bp-mirrors.txt >/dev/null ;;
            direct) sudo sed -i "s|mirror+file:/etc/apt/bp-mirrors.txt|$first|g" \
                      /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true ;;
          esac
          apt-get --version | head -1
          echo "mirrors:"; cat /etc/apt/bp-mirrors.txt
          grep -rhE '^(deb |URIs:)' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | sort -u
      - name: cold apt-get update x N
        run: |
          set -u
          mkdir -p hangs; echo -e "i\tsecs\texit\thung" > results.tsv
          for i in $(seq 1 "$N"); do
            sudo rm -rf /var/lib/apt/lists/*
            s=$(date +%s)
            sudo apt-get update -o Debug::pkgAcquire::Worker=1 > trace.log 2>&1 &
            pid=$!; hung=0
            while kill -0 $pid 2>/dev/null; do
              if [ $(( $(date +%s) - s )) -ge "$HANG_S" ]; then
                hung=1; d=hangs/$i; mkdir -p $d
                ps -eo pid,ppid,etime,stat,wchan:22,args | grep -E '[a]pt|[m]ethods' > $d/ps.txt
                sudo ss -tnpi | grep -A1 -E '"(http|https)"' > $d/ss.txt || true
                tail -200 trace.log > $d/trace-tail.log
                grep -E '^(Get|Hit|Ign|Err)' trace.log > $d/items.txt || true
                ls -la --time-style=+%T /var/lib/apt/lists/partial/ > $d/partial.txt 2>&1 || true
                sudo pkill -9 -f 'apt-get update'; sudo pkill -9 -f /usr/lib/apt/methods/ || true
                echo "::warning::iteration $i hung > ${HANG_S}s"
                break
              fi
              sleep 1
            done
            wait $pid; rc=$?
            e=$(date +%s)
            echo -e "$i\t$((e-s))\t$rc\t$hung" >> results.tsv
            [ "$rc" = 0 ] || [ "$hung" = 1 ] || { mkdir -p hangs/err-$i; tail -60 trace.log > hangs/err-$i/trace-tail.log; }
          done
          awk -F'\t' 'NR>1{n++; t+=$2; if($4==1)h++; else if($3!=0)f++; if($2>m)m=$2}
            END{printf "runs=%d hangs=%d other_fail=%d avg=%.1fs max=%ds\n", n, h, f, t/n, m}' results.tsv | tee summary.txt
          { echo "### ${{ matrix.runs_on }} ${{ matrix.variant }} shard ${{ matrix.shard }}"; cat summary.txt; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apt-stress-${{ matrix.runs_on }}-${{ matrix.variant }}-${{ matrix.shard }}
          path: |
            results.tsv
            hangs/
          if-no-files-found: ignore
