# Image-gap probe: Android SDK/NDK footprint and the kernel NFS mount that
# rclone's cmd/nfsmount test needs, on GitHub's runner vs ours.
name: img-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runs_on: [bp-ubuntu-latest-x64-4x, ubuntu-latest]
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Android footprint
        run: |
          env | grep -E '^(ANDROID|JAVA_HOME)' | sort || true
          java -version 2>&1 | head -1 || echo "no java"
          A=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          if [ -d "$A" ]; then
            sudo du -sh "$A" 2>/dev/null
            sudo du -sh "$A"/* 2>/dev/null | sort -h
            ls "$A/ndk" 2>/dev/null; sudo du -sh "$A"/ndk/* 2>/dev/null
            ls "$A/platforms" 2>/dev/null; ls "$A/build-tools" 2>/dev/null
          else echo "no android sdk"; fi
          df -h / | cat
      - name: Kernel NFS
        run: |
          uname -r
          grep -i nfs /proc/filesystems || echo "nfs not registered"
          ls /lib/modules/$(uname -r)/kernel/fs/nfs 2>&1 | head
          sudo apt-get update -qq && sudo apt-get install -y -qq nfs-common >/dev/null 2>&1; echo apt=$?
          grep -i nfs /proc/filesystems || echo "nfs not registered after install"
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '~1.27.4'
          cache: false
      - name: nfsmount test
        run: |
          sudo modprobe nfs 2>&1 || true
          go test -v -count=1 ./cmd/nfsmount 2>&1 | grep -E "mount|FAIL|ok|PASS|statd|Protocol" | head -30 || true
          grep -i nfs /proc/filesystems || true
          dmesg 2>/dev/null | tail -5 || sudo dmesg | tail -5 || true
