# Validates the runner-image start-statd shim (rpcbind for NFS mounts with
# locking) on our runner: shim first, then nfs-common as rclone's CI installs it.
name: nfs-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        shim: [none, applied]
    runs-on: bp-ubuntu-latest-x64-4x
    steps:
      - name: Apply the image shim
        if: matrix.shim == 'applied'
        run: |
          sudo bash -s <<'SHIM'
          set -eux
          dpkg-divert --local --rename --divert /usr/sbin/start-statd.distrib --add /usr/sbin/start-statd
          printf '%s\n' \
            '#!/bin/sh' \
            '# BuildPulse start-statd shim (docker/runner-image/Dockerfile). This container has' \
            '# no init, so nothing starts rpcbind, and rpc.statd cannot register without it.' \
            'if command -v rpcbind >/dev/null 2>&1 && ! pgrep -x rpcbind >/dev/null 2>&1; then' \
            '  rpcbind -w || true' \
            'fi' \
            'exec /usr/sbin/start-statd.distrib "$@"' \
            > /usr/sbin/start-statd
          chmod 0755 /usr/sbin/start-statd
          dpkg-divert --list | grep start-statd
          SHIM
      - name: Install nfs-common, as rclone's workflow does
        run: |
          dpkg -l nfs-common 2>/dev/null | tail -1 || echo "nfs-common not in image"
          sudo apt-get update -qq && sudo apt-get install -y -qq nfs-common rpcbind >/dev/null
          ls -l /usr/sbin/start-statd*
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '~1.27.4'
          cache: false
      - name: nfsmount test
        run: |
          go test -count=1 ./cmd/nfsmount 2>&1 | grep -E "^(ok|FAIL|---)|statd|Protocol|mount OK" | head -20
          pgrep -a rpcbind || true; pgrep -a rpc.statd || true
